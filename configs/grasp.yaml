# The grasp world (docs/gripper-experiment.md section 1).  Judge tier: like panels.yaml, this is the
# task distribution, so changing it changes the ruler.  One object per table; the task is to pick
# it up, lift it `lift_mm` and hold it `hold_s`.  Widths are across the jaws' closing axis.
table: {x: 0.22, y: 0.0, z: 0.0, half_x: 0.12, half_y: 0.15}
task:
  lift_mm: 30
  hold_s: 1.0
  time_limit_s: 20
  squeeze_cap_n: 120  # jaw squeeze on the target: static about 46 N at stall, closing peaks 54-83 N (D-035)
placement: {dx: [-0.04, 0.04], dy: [-0.05, 0.05]}  # object centre offset from the table centre (m)
friction: [0.5, 1.0]  # object surface friction; jaw contacts mix it with the PLA jaw (D-032)
# Phase A: inside the stock envelope measured by V1 (tests/golden/stock_grasp.json).
phase_a:
  cylinder: {width_mm: [25, 45], height_mm: [50, 80], mass_g: [50, 400]}
  box: {width_mm: [20, 50], height_mm: [40, 70], mass_g: [50, 400]}
# Phase B: each object fails the stock gripper for one known reason (gold designs come in V2), checked by a
# pick forced past the aperture rule (D-055).  On rigid contacts (D-054) the stock holds cans and boxes to 70 mm
# and spheres to 80 mm, so the wide objects sit past that; no sphere under the 85 mm height limit fails it.
# Densities are those of real things: a hollow can or box, and a steel calibration weight (7.9 g/cm3).
phase_b:
  - {id: wide_can_80, shape: cylinder, width_mm: 80, height_mm: 80, mass_g: 150, why: wider than the stable opening}
  - {id: wide_can_90, shape: cylinder, width_mm: 90, height_mm: 85, mass_g: 200, why: wider than the stable opening}
  - {id: wide_box_80, shape: box, width_mm: 80, height_mm: 60, mass_g: 150, why: wider than the stable opening}
  - {id: weight_1kg, shape: cylinder, width_mm: 48, height_mm: 70, mass_g: 1000, why: heavier than the stock arm lifts}

# Real objects (D-038): YCB scans from configs/ycb_objects.yaml, each resting in its natural pose
# with its narrowest side across the jaws.  The value is the object's grasp class, which the
# typecheck's aperture rule reads: box (flat faces), cylinder (upright, round in plan) or sphere
# (round in the jaws' vertical plane: balls, fruit, cans and markers lying on their side).
real:
  gelatin_box: box
  pudding_box: box
  sugar_box: box
  potted_meat_can: box
  mustard_bottle: box
  foam_brick: box
  wood_block_cube: box
  dice: box
  cup: cylinder
  tuna_fish_can: cylinder
  strawberry: sphere
  banana: sphere
  tomato_soup_can: sphere
  tennis_ball: sphere
  racquetball: sphere
  golf_ball: sphere
  lemon: sphere
  plum: sphere
  apple: sphere
  large_marker: sphere
  flat_screwdriver: sphere
