# Hard limits for the grasp world (spec Section 9; docs/gripper-experiment.md).  Same as limits.yaml
# except that a pinch is the task here, so it is not banned.  The jaws' squeeze on the target object
# is bounded by the servo and the grasp class cap (configs/grasp.yaml), not by max_force_n, which
# still bounds every other contact (pressing on the table, knocking into things).
max_force_n: 15
max_tip_speed_mps: 0.10
workspace_box:
  - {x: 0.10, y: -0.20, z: -0.10}
  - {x: 0.40, y: 0.20, z: 0.25}
banned_contacts: []
max_tool_mass_g: 40
max_link_scale: 1.3
min_wall_mm: 1.2
